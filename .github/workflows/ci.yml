name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify deterministic checked-in fixtures
        shell: bash
        run: |
          npm run test:x402-producer
          archived_hash="$(sha256sum fixtures/v0.1/cases.json | cut -d ' ' -f 1)"
          test "$archived_hash" = "4ff061cfa709b043662e67335bf4abd0e8dcf8cb45d32ee333992e3789d95a80"
          archived_v02_hash="$(sha256sum fixtures/v0.2/cases.json | cut -d ' ' -f 1)"
          test "$archived_v02_hash" = "1e8168b52c463a5441590b051facb767317a71cadbde3fcab6aee2d40f3fbaa1"
          npm run fixtures:generate
          git diff --exit-code -- fixtures/v0.3/cases.json
          first_hash="$(sha256sum fixtures/v0.3/cases.json | cut -d ' ' -f 1)"
          npm run fixtures:generate
          second_hash="$(sha256sum fixtures/v0.3/cases.json | cut -d ' ' -f 1)"
          test "$first_hash" = "$second_hash"

      - name: Run repository checks
        run: npm run ci

  ap2-artifacts:
    name: Pinned AP2 artifact verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_VERSION: 0.10.11
      AP2_SIGNED_EXPECTED_SHA256: a73ca6a0e095e8608cf2ee3100b9893d0c92a217acf38332d476e671833bf9c4
      AP2_NORMALIZED_EXPECTED_SHA256: e489314c8310e93dde173d4db35ccd1cf9b5d9b458b0e626207c175a03316ab8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up locked uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: scripts/ap2/requirements.lock.txt

      - name: Confirm pinned toolchain and committed artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          python_version="$(python --version)"
          case "$python_version" in
            "Python 3.12."*) ;;
            *) echo "Expected Python 3.12.x, got $python_version" >&2; exit 1 ;;
          esac
          test "$(uv --version | awk '{print $2}')" = "$UV_VERSION"
          echo "$AP2_SIGNED_EXPECTED_SHA256  fixtures/v0.1/ap2-signed-artifacts.json" | sha256sum --check --strict
          echo "$AP2_NORMALIZED_EXPECTED_SHA256  fixtures/v0.1/ap2-normalized-records.json" | sha256sum --check --strict

      - name: Regenerate and independently verify pinned AP2 artifacts twice
        shell: bash
        env:
          AP2_PIPELINE_CACHE_DIR: ${{ runner.temp }}/pulse-ap2-pinned
        run: |
          set -euo pipefail
          sh scripts/ap2/run-pinned.sh
          git diff --exit-code -- \
            fixtures/v0.1/ap2-signed-artifacts.json \
            fixtures/v0.1/ap2-normalized-records.json
          first_signed_hash="$(sha256sum fixtures/v0.1/ap2-signed-artifacts.json | cut -d ' ' -f 1)"
          first_normalized_hash="$(sha256sum fixtures/v0.1/ap2-normalized-records.json | cut -d ' ' -f 1)"
          test "$first_signed_hash" = "$AP2_SIGNED_EXPECTED_SHA256"
          test "$first_normalized_hash" = "$AP2_NORMALIZED_EXPECTED_SHA256"

          sh scripts/ap2/run-pinned.sh
          second_signed_hash="$(sha256sum fixtures/v0.1/ap2-signed-artifacts.json | cut -d ' ' -f 1)"
          second_normalized_hash="$(sha256sum fixtures/v0.1/ap2-normalized-records.json | cut -d ' ' -f 1)"
          test "$second_signed_hash" = "$first_signed_hash"
          test "$second_normalized_hash" = "$first_normalized_hash"
          git diff --exit-code -- \
            fixtures/v0.1/ap2-signed-artifacts.json \
            fixtures/v0.1/ap2-normalized-records.json

  ci-required:
    name: Required CI result
    if: always()
    needs: [verify, ap2-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every Node.js and AP2 job to pass
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
          AP2_RESULT: ${{ needs.ap2-artifacts.result }}
        run: |
          test "$MATRIX_RESULT" = "success"
          test "$AP2_RESULT" = "success"

  scheduled-evidence:
    name: Record daily Required CI evidence
    if: always() && github.event_name == 'schedule'
    needs: [verify, ap2-artifacts, ci-required]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write machine-readable evidence and run summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          NODE_RESULT: ${{ needs.verify.result }}
          AP2_RESULT: ${{ needs.ap2-artifacts.result }}
          REQUIRED_RESULT: ${{ needs.ci-required.result }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/ci-evidence
          jq -n \
            --arg runUrl "$RUN_URL" \
            --arg commitSha "$COMMIT_SHA" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg nodeResult "$NODE_RESULT" \
            --arg ap2Result "$AP2_RESULT" \
            --arg requiredResult "$REQUIRED_RESULT" \
            '{
              runUrl: $runUrl,
              commitSha: $commitSha,
              recordedAt: $recordedAt,
              jobs: {
                nodeMatrix: $nodeResult,
                pinnedAp2Artifacts: $ap2Result,
                requiredCi: $requiredResult
              }
            }' > reports/ci-evidence/required-ci.json

          {
            echo "## Daily Required CI evidence"
            echo
            echo "- Run: [$RUN_URL]($RUN_URL)"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Node matrix: \`$NODE_RESULT\`"
            echo "- Pinned AP2 artifacts: \`$AP2_RESULT\`"
            echo "- Required CI: \`$REQUIRED_RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload daily evidence record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: required-ci-evidence-${{ github.run_id }}
          path: reports/ci-evidence/required-ci.json
          if-no-files-found: error
          retention-days: 30
